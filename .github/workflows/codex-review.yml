name: Codex Task Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Independent Codex Review
    if: startsWith(github.head_ref, 'codex/task-')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    outputs:
      review_json: ${{ steps.codex.outputs.final-message }}
      task_id: ${{ steps.task.outputs.task_id }}
      task_file: ${{ steps.task.outputs.task_file }}

    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base and head refs
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            "$BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Resolve current task
        id: task
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [[ ! "$HEAD_REF" =~ ^codex/task-([0-9]{2})- ]]; then
            echo "Unexpected Codex task branch name: $HEAD_REF"
            exit 1
          fi

          TASK_NUMBER="${BASH_REMATCH[1]}"

          shopt -s nullglob
          matches=(docs/tasks/TASK-"$TASK_NUMBER"-*.md)

          if [ "${#matches[@]}" -ne 1 ]; then
            echo "Expected exactly one task file for TASK-$TASK_NUMBER."
            printf '%s\n' "${matches[@]}"
            exit 1
          fi

          TASK_FILE="${matches[0]}"

          echo "task_id=TASK-$TASK_NUMBER" >> "$GITHUB_OUTPUT"
          echo "task_file=$TASK_FILE" >> "$GITHUB_OUTPUT"

          echo "Resolved task: $TASK_FILE"

      - name: Prepare trusted review control files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TASK_FILE: ${{ steps.task.outputs.task_file }}
        run: |
          set -euo pipefail

          mkdir -p .codex-review-control

          git show "$BASE_SHA:AGENTS.md" \
            > .codex-review-control/AGENTS.md

          git show "$BASE_SHA:.github/codex/prompts/review.md" \
            > .codex-review-control/review.md

          git show "$BASE_SHA:.github/codex/schemas/review.schema.json" \
            > .codex-review-control/review.schema.json

          git show "$BASE_SHA:$TASK_FILE" \
            > .codex-review-control/task.md

      - name: Validate trusted review schema
        shell: bash
        run: |
          set -euo pipefail

          node -e "
            JSON.parse(
              require('fs').readFileSync(
                '.codex-review-control/review.schema.json',
                'utf8'
              )
            );
            console.log('Review schema is valid JSON');
          "

      - name: Run independent Codex reviewer
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          safety-strategy: drop-sudo
          output-schema-file: .codex-review-control/review.schema.json
          prompt: |
            Perform an independent review of this pull request.

            Read and follow the trusted reviewer instructions from:

            .codex-review-control/review.md

            Use these trusted base-branch files as authoritative:

            AGENTS rules:
            .codex-review-control/AGENTS.md

            Current TASK specification:
            .codex-review-control/task.md

            Current TASK identifier:
            ${{ steps.task.outputs.task_id }}

            Current TASK repository path:
            ${{ steps.task.outputs.task_file }}

            Pull request:
            #${{ github.event.pull_request.number }}

            Base SHA:
            ${{ github.event.pull_request.base.sha }}

            Head SHA:
            ${{ github.event.pull_request.head.sha }}

            Review the changes introduced between the base and head commits.

            Independently inspect relevant surrounding repository code and tests.

            Do not trust the implementer's claims without verification.

            Do not modify any repository file.

            Return only JSON conforming to the supplied output schema.

  publish-review:
    name: Publish Review Result
    needs:
      - review

    if: needs.review.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Validate and publish Codex review
        id: publish
        uses: actions/github-script@v8
        env:
          REVIEW_JSON: ${{ needs.review.outputs.review_json }}
          TASK_ID: ${{ needs.review.outputs.task_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- codex-task-evaluation -->';

            let review;

            try {
              review = JSON.parse(process.env.REVIEW_JSON);
            } catch (error) {
              core.setFailed(
                `Codex returned invalid JSON: ${error.message}`
              );
              return;
            }

            if (!['PASS', 'FAIL'].includes(review.verdict)) {
              core.setFailed(
                `Invalid review verdict: ${review.verdict}`
              );
              return;
            }

            if (!Array.isArray(review.blockers)) {
              core.setFailed('Review blockers must be an array.');
              return;
            }

            if (review.verdict === 'PASS' && review.blockers.length !== 0) {
              core.setFailed(
                'Invalid review: PASS verdict contains blockers.'
              );
              return;
            }

            if (review.verdict === 'FAIL' && review.blockers.length === 0) {
              core.setFailed(
                'Invalid review: FAIL verdict contains no blockers.'
              );
              return;
            }

            if (review.task_id !== process.env.TASK_ID) {
              core.setFailed(
                `Task mismatch. Expected ${process.env.TASK_ID}, ` +
                `received ${review.task_id}.`
              );
              return;
            }

            const icon = review.verdict === 'PASS' ? '✅' : '❌';

            const lines = [
              marker,
              `## ${icon} Codex Independent Task Evaluation`,
              '',
              `**Task:** \`${review.task_id}\``,
              `**Verdict:** **${review.verdict}**`,
              '',
              '### Summary',
              review.summary,
              ''
            ];

            if (review.blockers.length > 0) {
              lines.push('### Blockers', '');

              review.blockers.forEach((blocker, index) => {
                lines.push(
                  `#### ${index + 1}. ${blocker.title}`,
                  '',
                  `**Category:** \`${blocker.category}\``,
                  '',
                  blocker.reason,
                  '',
                  '**Affected files:**',
                  ...blocker.files.map(file => `- \`${file}\``),
                  '',
                  `**Required fix:** ${blocker.required_fix}`,
                  ''
                );
              });
            } else {
              lines.push(
                '### Blockers',
                '',
                'None.',
                ''
              );
            }

            lines.push(
              '### Acceptance Criteria',
              ''
            );

            review.acceptance_criteria_checked.forEach(item => {
              lines.push(
                `- ${item.passed ? '✅' : '❌'} ${item.criterion}`,
                `  - Evidence: ${item.evidence}`
              );
            });

            lines.push('');

            if (review.non_blocking_improvements.length > 0) {
              lines.push(
                '### Non-blocking Improvements',
                '',
                ...review.non_blocking_improvements.map(
                  item => `- ${item}`
                ),
                ''
              );
            }

            if (review.preferences.length > 0) {
              lines.push(
                '### Preferences',
                '',
                ...review.preferences.map(
                  item => `- ${item}`
                ),
                ''
              );
            }

            lines.push(
              '---',
              'This evaluation does not merge the pull request.',
              'Human review and manual merge are required.'
            );

            const body = lines.join('\n');

            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100
              });

            const existing = comments.find(
              comment =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

            core.setOutput('verdict', review.verdict);

      - name: Enforce review verdict
        if: steps.publish.outputs.verdict == 'FAIL'
        shell: bash
        run: |
          echo "Codex found one or more Blockers."
          echo "The pull request remains open for human action."
          exit 1