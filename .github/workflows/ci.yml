name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore TransferOrchestrationPlatform.sln

      - name: Build
        run: >
          dotnet build
          TransferOrchestrationPlatform.sln
          --no-restore

      - name: Test
        run: >
          dotnet test
          TransferOrchestrationPlatform.sln
          --no-build
          --logger "console;verbosity=normal"