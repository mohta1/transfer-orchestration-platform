name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: transfer_orchestration
          POSTGRES_USER: transfer_app
          POSTGRES_PASSWORD: transfer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transfer_app -d transfer_orchestration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_CONNECTION_STRING: >-
        Host=localhost;
        Port=5432;
        Database=transfer_orchestration;
        Username=transfer_app;
        Password=transfer_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore TransferOrchestrationPlatform.sln

      - name: Build
        run: >
          dotnet build
          TransferOrchestrationPlatform.sln
          --no-restore

      - name: Test
        run: >
          dotnet test
          TransferOrchestrationPlatform.sln
          --no-build
          --logger "console;verbosity=normal"

  runtime-verification:
    name: Runtime Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config > /dev/null

      - name: Build runtime images
        run: docker compose build

      - name: Inspect runtime image excludes test artifacts
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker compose images -q api | head -n 1)"
          if docker run --rm "$IMAGE_ID" sh -c 'ls /app/*Tests.dll 2>/dev/null | grep -q .'; then
            echo "Test assemblies must not be present in the runtime image." >&2
            exit 1
          fi
          SDK_VERSION="$(docker run --rm "$IMAGE_ID" dotnet --list-sdks 2>/dev/null || true)"
          if [ -n "$SDK_VERSION" ]; then
            echo ".NET SDK must not be present in the runtime image." >&2
            exit 1
          fi
          echo "Runtime image content inspection passed."

      - name: Verify Compose runtime
        run: ./scripts/verify-compose-runtime.sh
